# agy_cli_review.yaml
# Antigravity CLI 实验复评配置（相对路径基于项目根目录）

# 候选列表 JSON
candidates: data/candidates/candidates_latest.json

# 候选图表目录（其下按 pick_date 分目录）
kline_dir: data/kline

# 实验结果输出目录。保持与正式 data/review/{pick_date} 隔离。
output_dir: data/review/agy_cli_experimental

# 提示词文件
prompt_path: agent/prompt.md

# AGY CLI 可执行文件名或绝对路径
agy_bin: agy

# AGY 1.0.5 支持 per-call --model；workbench 下拉候选直接来自 `agy models`。
model: "Gemini 3.5 Flash (Medium)"

# AGY print mode 超时
print_timeout: 10m

# Python 子进程总超时（秒）
timeout_seconds: 900

# 相邻 CLI 调用间隔（秒）
request_delay: 10

# 本次 AGY 实验最多复评前 N 个候选；默认只跑 1 支，避免误跑完整批次。
max_items: 1

# true: 跳过已存在的 agy-cli-experimental 单股 JSON（断点续跑）
skip_existing: true

# 推荐最小分数门槛
suggest_min_score: 4.0

# 保存每次 AGY CLI 调用的 prompt/stdout/stderr/meta
save_raw_cli_io: true

# 原始调用日志目录；留空时使用 data/review/agy_cli_experimental/{pick_date}/agy_cli_runs
raw_log_dir: ""

# AGY 1.0.5 没有 --output-format。这里使用 prompt 约束模型正文为 JSON，
# 本地提取并校验 schema；失败时最多追加一次 JSON 修复调用。
json_repair_enabled: true
json_repair_prompt_max_chars: 12000

# settings 仅作为辅助证据读取；实际模型由上面的 model 通过 --model 指定。
settings_path: ~/.gemini/antigravity-cli/settings.json
expected_model_label: ""
fail_on_model_mismatch: false

# 与现有 Gemini 复评保持同一评分归一化口径
classic_pattern_enabled: true
