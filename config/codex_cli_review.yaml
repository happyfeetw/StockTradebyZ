# codex_cli_review.yaml
# Codex CLI 图表复评配置（相对路径基于项目根目录）

candidates: data/candidates/candidates_latest.json
kline_dir: data/kline
output_dir: data/review/codex_cli
prompt_path: agent/prompt.md

codex_bin: codex

# Codex reviewer 固定模型与推理配置；脚本会强制覆盖这些值。
model: gpt-5.5
model_profile: gpt-5.5-high-standard
reasoning_effort: high
speed_tier: standard

# 默认读取本机 Codex CLI 用户配置与 OAuth 登录态（~/.codex/config.toml / auth.json）。
# 不要默认隔离用户配置，否则容易绕过 OAuth 路径。
auth_mode: local_oauth
ignore_user_config: false

# 兼容旧的 OpenAI-compatible 本地代理路径。默认关闭；只有明确需要 CCSwitch
# 或其他本地代理时才打开，否则 Codex reviewer 会走本机 Codex CLI OAuth。
# 示例：
#   CODEX_OPENAI_BASE_URL=http://127.0.0.1:8317/v1
#   CODEX_OPENAI_API_KEY=<ccswitch-api-key>
env_provider_enabled: false
codex_provider_name: env_custom
codex_base_url: ""
base_url_env_vars:
  - CODEX_OPENAI_BASE_URL
  - OPENAI_BASE_URL
  - OPENAI_API_BASE
api_key_env_vars:
  - CODEX_OPENAI_API_KEY
  - OPENAI_API_KEY

timeout_seconds: 900
request_delay: 1
batch_size: 5

# 单独 smoke test 默认只跑 1 支；多模型编排会覆盖为 null。
max_items: 1

skip_existing: true
suggest_min_score: 4.0
save_raw_cli_io: true
raw_log_dir: ""
fallback_to_single_on_batch_error: true
retry_backoff_seconds:
  - 30
  - 90

classic_pattern_enabled: true
