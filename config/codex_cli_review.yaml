# codex_cli_review.yaml
# Codex CLI 图表复评配置（相对路径基于项目根目录）

candidates: data/candidates/candidates_latest.json
kline_dir: data/kline
output_dir: data/review/codex_cli
prompt_path: agent/prompt.md

codex_bin: codex

# Codex reviewer 固定模型与推理配置；脚本会强制覆盖这些值。
model: gpt-5.5
model_profile: gpt-5.5-high-standard
reasoning_effort: high
speed_tier: standard

timeout_seconds: 900
request_delay: 1
batch_size: 5

# 单独 smoke test 默认只跑 1 支；多模型编排会覆盖为 null。
max_items: 1

skip_existing: true
suggest_min_score: 4.0
save_raw_cli_io: true
raw_log_dir: ""
fallback_to_single_on_batch_error: true
retry_backoff_seconds:
  - 30
  - 90

classic_pattern_enabled: true
