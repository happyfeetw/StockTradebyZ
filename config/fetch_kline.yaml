# ============================================================
# fetch_kline.py 配置文件
# ============================================================

# 抓取日期范围（YYYYMMDD 或 'today'）
start: "20190101"
end: "today"

# 股票清单 CSV 路径（需含 ts_code 与 symbol 列）
stocklist: "./pipeline/stocklist.csv"

# 排除板块，可选值：
#   gem  — 创业板（300/301 开头，后缀 .SZ）
#   star — 科创板（688 开头，后缀 .SH）
#   bj   — 北交所（4/8 开头，后缀 .BJ）
#   st   — ST/*ST 股票
# 如需全部保留，设为空列表 []
exclude_boards:
  - st
  - star
  - bj

# K线数据输出目录
out: "./data/raw"

# 并发下载线程数
workers: 4

# Tushare pro_bar(qfq) 调用限速。qfq 会隐式调用 adj_factor，默认低于 200次/分钟配额。
tushare_requests_per_minute: 180
tushare_rate_cooldown_seconds: 70
