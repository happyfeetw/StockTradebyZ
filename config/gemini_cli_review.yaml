# gemini_cli_review.yaml
# Gemini CLI 图表复评配置（相对路径基于项目根目录）

# 候选列表 JSON
candidates: data/candidates/candidates_latest.json

# 候选图表目录（其下按 pick_date 分目录）
kline_dir: data/kline

# 评分结果输出目录
output_dir: data/review

# 提示词文件
prompt_path: agent/prompt.md

# Gemini CLI 可执行文件名或绝对路径
gemini_bin: gemini

# Gemini CLI 复评默认模型
model: "gemini-3.1-pro-preview"

# CLI 输出格式：stream-json、json 或 text
output_format: stream-json

# 单次 CLI 调用超时时间（秒）
timeout_seconds: 900

# 单次 CLI 调用空闲超时时间（秒）：超过该时间没有 stdout/stderr 输出即中止
idle_timeout_seconds: 180

# 相邻 CLI 调用间隔（秒），用于降低分钟级限流风险
request_delay: 10

# 单次 Gemini CLI 请求最多提交几张图；会再按上下文 token 预算动态切批
batch_size: 5

# 保存每次 CLI 调用的原始 prompt/stdout/stderr/meta，便于诊断卡顿与超时
save_raw_cli_io: true

# 原始调用日志目录；留空时使用 data/review/{pick_date}/gemini_cli_runs
raw_log_dir: ""

# 批量返回解析失败、超时或流式连接中断时，是否自动拆批并最终降级逐只复评
fallback_to_single_on_batch_error: true

# 遇到 429/RESOURCE_EXHAUSTED/No capacity available/Premature close 等错误时的退避序列（秒）
retry_backoff_seconds:
  - 30
  - 90
  - 180
  - 480
  - 900

# 退避 jitter 比例。0.2 表示实际等待在 base ±20% 内浮动
retry_jitter_ratio: 0.2

# 单次运行最多新发起多少次 Gemini CLI 请求；null 表示不限制
# 注意：如果批量请求持续失败并降级逐只复评，请同步提高该值或分多次断点续跑
max_requests_per_run: 50

# 项目侧每日请求预算；null 表示不限制
daily_request_budget: 80

# 每日使用计数文件
usage_file: data/review/.gemini_cli_usage.json

# 遇到 quota/rate limit/429 等错误时是否立即停止批量复评
stop_on_rate_limit: false

# 兼容旧配置；新逻辑优先使用 retry_backoff_seconds
rate_limit_backoff_seconds: 300

# true: 跳过已存在单股 JSON（断点续跑）
skip_existing: true

# 推荐最小分数门槛
suggest_min_score: 4.0
