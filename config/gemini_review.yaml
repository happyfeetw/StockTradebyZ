# gemini_review.yaml
# Gemini 图表复评配置（相对路径基于项目根目录）

# 候选列表 JSON
candidates: data/candidates/candidates_latest.json

# 候选图表目录（其下按 pick_date 分目录）
kline_dir: data/kline

# 评分结果输出目录
output_dir: data/review

# 提示词文件
prompt_path: agent/prompt.md

# Gemini 模型名称
model: gemini-3.1-pro-preview

# 相邻 API 调用间隔（秒）
request_delay: 5

# true: 跳过已存在单股 JSON（断点续跑）
skip_existing: false

# 推荐最小分数门槛
suggest_min_score: 4.0

# 启用经典图形匹配环节的单一策略；命中这些策略时使用五维评分权重。
# 复合策略不应写入这里，未列入的策略走基础四维评分。
classic_pattern_strategies:
  - b1
  - b2
  - brick
