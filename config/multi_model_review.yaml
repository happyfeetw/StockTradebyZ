# multi_model_review.yaml
# 多模型复评与共识汇总配置

candidates: data/candidates/candidates_latest.json
kline_dir: data/kline
prompt_path: agent/prompt.md

batch_root: data/review_batches
review_runs_dir: data/review_runs
consensus_dir: data/review_consensus
expected_strategies:
  - b1
  - b2
  - brick
strict_batch: true

suggest_min_score: 4.0
batch_size: 5
skip_existing: true
classic_pattern_enabled: true
group_review_by_strategy: true

# 命令行 reviewer 必须只运行本配置声明的模型；不可用/失败时记录原因，
# 最后一轮按原模型重跑一次，不允许自动替换成其它模型。
no_model_substitution: true
rerun_failed_models_once: true

z_quality:
  enabled: true
  config: config/z_quality_rules.yaml
  output_root: data/z_quality

review_scoring:
  enabled: true
  common_gate:
    enabled: true
    pass_min: 3.2
    watch_min: 2.6
    hard_fail_below: 2.2
    watch_caps_strategy_pass: true
  strategy_profiles:
    b1:
      pass_min: 4.1
      watch_min: 3.4
    b2:
      pass_min: 4.2
      watch_min: 3.5
    brick:
      pass_min: 4.2
      watch_min: 3.5

reviewers:
  - enabled: true
    reviewer_key: agy-cli
    model_key: gemini-3.5-flash-high
    label: Gemini 3.5 Flash High
    script: agent/agy_cli_review.py
    config: config/agy_cli_review.yaml
    model: "Gemini 3.5 Flash (High)"
    model_profile: gemini-3.5-flash-high
    batch_size: 1
    print_timeout: 6m
    timeout_seconds: 360
    request_delay: 2

  - enabled: true
    reviewer_key: agy-cli
    model_key: gemini-3.1-pro-high
    label: Gemini 3.1 Pro High
    script: agent/agy_cli_review.py
    config: config/agy_cli_review.yaml
    model: "Gemini 3.1 Pro (High)"
    model_profile: gemini-3.1-pro-high
    batch_size: 1
    print_timeout: 6m
    timeout_seconds: 360
    request_delay: 2

  - enabled: true
    reviewer_key: codex-cli
    model_key: gpt-5.5-high
    label: GPT-5.5 High
    script: agent/codex_cli_review.py
    config: config/codex_cli_review.yaml
    model: gpt-5.5
    model_profile: gpt-5.5-high-standard
    batch_size: 5
