# rules_preselect.yaml
# 量化初选规则配置文件
# pipeline/select_stock.py 读取本文件中的参数

# ── 全局设置 ─────────────────────────────────────────────────────────
global:
  data_dir: "./data/raw"          # A股日线CSV目录
  output_dir: "./data/candidates" # 候选结果输出目录
  top_m: 5000                     # 流动性池：取成交额最高的 top_m 只
  n_turnover_days: 43             # 滚动成交额窗口（日）
  min_bars_buffer: 10             # 额外的最小 bar 缓冲
  prepare_executor: "thread"      # 预处理执行器：process 或 thread；受限环境会自动降级 thread
  n_jobs: null                    # 预处理并发数；null = 默认

# ── B1 策略参数（KDJ + 知行均线多头排列） ────────────────────────────
b1:
  enabled: true
  zx_m1: 14
  zx_m2: 28
  zx_m3: 57
  zx_m4: 114
  j_threshold: 15.0
  j_q_threshold: 0.10

# ── B2 策略参数（B1 后强阳确认） ────────────────────────────────────
b2:
  enabled: false
  b1_lookback: 2                  # 前置 B1 窗口：T-1 或 T-2 需满足 B1
  min_return: 0.04                # 当日收盘涨幅必须大于 4%
  min_today_body_pct: 0.003       # 当日实体阳线最小实体比例，过滤假阴真阳/十字星
  j_ceiling: 55.0                 # B2 当日 J 值安全上限
  require_j_turn_up: true         # B2 当日 J 必须相对触发 B1 日拐头向上
  volume_ratio_min: 1.0           # 正常放量阈值：volume_T > volume_T-1
  flat_volume_ratio: 0.98         # 近似平量阈值；平量时必须严格阳包阴
  min_yang_bao_yin_body_pct: 0.003
  upper_shadow_soft_limit: 0.15   # 上影线软降分阈值，不做硬过滤

# ── 砖型图（BrickChart）策略参数 ──────────────────────────────────────
brick:
  enabled: false

  # 砖型图计算参数
  n: 8
  m1: 3
  m2: 12
  m3: 12
  t: 8
  shift1: 92
  shift2: 114
  sma_w1: 1
  sma_w2: 1
  sma_w3: 1

  # 选股过滤阈值
  daily_return_threshold: 0.2    # 今日涨幅上限
  brick_growth_ratio: 0.5         # 今日红柱 >= N × 昨日绿柱绝对值
  min_prior_green_bars: 1         # 红柱前至少有几根连续绿柱

  # 知行线参数
  zxdq_ratio: 1.47                 # 收盘价 < zxdq × ratio；null = 不启用
  zxdq_span: 10
  require_zxdq_gt_zxdkx: true
  zxdkx_m1: 14
  zxdkx_m2: 28
  zxdkx_m3: 57
  zxdkx_m4: 114

  # 周线均线多头排列
  require_weekly_ma_bull: true
  wma_short: 5
  wma_mid: 10
  wma_long: 20
